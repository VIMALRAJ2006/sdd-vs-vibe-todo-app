<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <script>
    (function () {
      var KEY = "todo-app:theme";
      var saved = localStorage.getItem(KEY);
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header__row">
        <div class="header__brand">
          <div class="header__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
          </div>
          <h1 class="header__title">Tasks</h1>
        </div>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          <svg class="theme-toggle__icon theme-toggle__icon--sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__icon--moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
      <p class="header__subtitle" id="task-count" aria-live="polite" aria-atomic="true">0 tasks remaining</p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <div class="add-form__main">
        <label for="task-input" class="visually-hidden">New task</label>
        <input
          type="text"
          id="task-input"
          class="add-form__input"
          placeholder="What needs to be done?"
          maxlength="200"
          required
        />
        <button type="submit" class="add-form__btn" aria-label="Add task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="add-form__meta">
        <div class="add-form__field">
          <label for="task-category" class="add-form__label">Category</label>
          <select id="task-category" class="add-form__select">
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="shopping">Shopping</option>
            <option value="health">Health</option>
            <option value="other" selected>Other</option>
          </select>
        </div>
        <div class="add-form__field">
          <label for="task-due" class="add-form__label">Due date <span class="add-form__optional">(optional)</span></label>
          <input type="date" id="task-due" class="add-form__date" />
        </div>
      </div>
    </form>

    <div
      class="filters"
      id="filters"
      role="tablist"
      aria-label="Filter tasks"
    >
      <button type="button" class="filters__btn" role="tab" id="filter-all" data-filter="all" aria-selected="true">All</button>
      <button type="button" class="filters__btn" role="tab" id="filter-active" data-filter="active" aria-selected="false">Active</button>
      <button type="button" class="filters__btn" role="tab" id="filter-completed" data-filter="completed" aria-selected="false">Completed</button>
    </div>

    <ul class="task-list" id="task-list" role="list"></ul>

    <p class="empty-state" id="empty-state">
      <span class="empty-state__emoji" aria-hidden="true">✨</span>
      <span id="empty-state-text">No tasks yet. Add one above!</span>
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
